[project]
name = "microshop"
version = "0.1.0"
description = "FastAPI Asynchronous Microservices Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "passlib[bcrypt]>=1.7.4",
    "pydantic[email]>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "pytest-asyncio>=1.4.0",
    "pytest>=9.1.1",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.52",
    "sqlmodel>=0.0.39",
    "uvicorn[standard]>=0.52.4",
    "alembic>=1.19.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
