<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MicroShop - Next-Gen E-Commerce Microservices Platform</title>
  <meta name="description" content="High-performance asynchronous microservice e-commerce store built with FastAPI, Redis, PostgreSQL, and SQLModel.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
    <a href="#" class="brand">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
        <line x1="3" y1="6" x2="21" y2="6"/>
        <path d="M16 10a4 4 0 0 1-8 0"/>
      </svg>
      MicroShop
      <span id="debug-badge" class="badge-debug">DEBUG: TRUE</span>
    </a>

    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" id="search-input" placeholder="Search catalog...">
    </div>

    <div class="nav-actions">
      <button class="btn btn-secondary cart-btn" id="cart-nav-btn" onclick="openCartModal()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
        </svg>
        Cart
        <span class="cart-count" id="cart-count">0</span>
      </button>
    </div>
  </header>

  <main class="container">
    <!-- Hero Banner -->
    <section class="hero">
      <h1>Premium Tech & Lifestyle Store</h1>
      <p>Powered by Python FastAPI, Redis, PostgreSQL, and XHTTP Microservices Gateway.</p>
    </section>

    <!-- Categories Filter Bar -->
    <nav class="categories-bar" id="categories-container" aria-label="Product Categories">
      <!-- Dynamic category pills -->
    </nav>

    <!-- Product Grid -->
    <section class="products-grid" id="products-grid">
      <!-- Dynamic product cards -->
    </section>
  </main>

  <!-- Cart Modal Drawer -->
  <div class="modal-backdrop" id="cart-modal">
    <div class="modal-card">
      <button class="close-btn" onclick="closeCartModal()">✕</button>
      <h2 class="modal-title">Shopping Cart</h2>
      <div id="cart-modal-body">
        <!-- Dynamic Cart Content -->
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
